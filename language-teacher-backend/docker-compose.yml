version: "3.9"

services:
  postgres:
    image: postgres:17

    container_name: language-app-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: language_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5430:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: